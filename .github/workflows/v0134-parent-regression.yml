name: Open WebUI v0.13.4 parent regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  regression:
    if: github.event.pull_request.head.ref == 'codex/openwebui-v0.13.4-update'
    uses: open-webui/tests/.github/workflows/regression.yml@main
    with:
      # Pin tests to the v0.13.4-era suite; it includes image-connection, visualization, and
      # folder-move updates while predating the newer machines API in tests/main.
      open-webui-ref: 1c33f45857c86c84be270bf699caf72ee0ed8411
      tests-ref: 23aa76a611ef641845c0f8f90f0681f30df6f04b
      suite: unit
